<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Draft Helper - Login</title>
<style>
    :root {
        --bg: #0f1420;
        --card: #171d2b;
        --border: #2a3245;
        --text: #e7ebf3;
        --muted: #9aa4b8;
        --red: #e0563c;
        --blue: #4c8bf5;
    }
    * { box-sizing: border-box; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px;
        width: 100%;
        max-width: 340px;
    }
    h1 {
        font-size: 20px;
        margin: 0 0 24px;
        text-align: center;
    }
    input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        margin-bottom: 16px;
    }
    button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: none;
        background: var(--blue);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .error {
        color: var(--red);
        font-size: 13px;
        margin-bottom: 16px;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="login-card">
        <h1>🏆 FPL Draft Helper</h1>
        <form method="post">
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <input type="password" name="password" placeholder="Password" autofocus required>
            <button type="submit">Log in</button>
        </form>
    </div>
</body>
</html>
